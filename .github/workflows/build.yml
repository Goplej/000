name: Build The Director

# Сборка и проверка мода на раннерах GitHub (там есть доступ к maven.minecraftforge.net
# и к ассетам Mojang, которых нет в песочнице).
#
# Что делают задания:
#   build   — ./gradlew build, публикация готового JAR и лога сборки в каталог ci/
#   runtime — запуск настоящего выделенного сервера с самотестом мода
#             (THEDIRECTOR_SELFTEST=1) и публикация серверного лога в ci/
#
# Артефакты публикуются в ci/ этой же ветки, поэтому сам workflow не перезапускается
# на собственные коммиты (paths-ignore: ci/**).

on:
  push:
    branches:
      - 'arena/**'
    paths-ignore:
      - 'ci/**'
      - '**/*.md'
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle build
        id: gradle
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew build --no-daemon --console=plain --stacktrace > build_output.txt 2>&1
          echo "gradle_exit_code=$?" >> build_output.txt
          tail -n 80 build_output.txt

      - name: Probe real 1.20.1 API signatures
        if: always()
        run: |
          {
            MCJAR=""; FORGEJAR=""
            while read -r j; do
              if [ -z "$MCJAR" ] && unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/server/level/ServerPlayer.class"; then MCJAR="$j"; fi
              if [ -z "$FORGEJAR" ] && unzip -l "$j" 2>/dev/null | grep -q "net/minecraftforge/network/NetworkRegistry.class"; then FORGEJAR="$j"; fi
              if [ -n "$MCJAR" ] && [ -n "$FORGEJAR" ]; then break; fi
            done < <(find ~/.gradle/caches -name "*.jar" 2>/dev/null | grep -v sources | head -500)
            echo "MCJAR=$MCJAR"
            echo "FORGEJAR=$FORGEJAR"
            CP="$MCJAR:$FORGEJAR"
            echo "=== forge network classes ==="
            unzip -l "$FORGEJAR" 2>/dev/null | grep -E "network/.*(SimpleChannel|ChannelBuilder|NetworkRegistry|NetworkDirection|MessageBuilder)" | head -20
            echo "=== NetworkRegistry ==="
            javap -classpath "$CP" net.minecraftforge.network.NetworkRegistry 2>&1 | head -25
            echo "=== SimpleChannel ==="
            javap -classpath "$CP" net.minecraftforge.network.simple.SimpleChannel 2>&1 | head -25
            echo "=== mods.toml in jar ==="
            unzip -p build/libs/*.jar META-INF/mods.toml 2>&1 | head -12
            echo "=== MinecraftServer command API ==="
            javap -classpath "$CP" net.minecraft.server.MinecraftServer 2>&1 | grep -iE "CommandSourceStack|performPrefixedCommand|getCommands" | head -8
            echo "=== CommandSourceStack ==="
            javap -classpath "$CP" net.minecraft.commands.CommandSourceStack 2>&1 | grep -iE "sendSuccess|sendSystemMessage|getPlayerOrException|hasPermission" | head -10
            echo "=== RegisterCommandsEvent ==="
            unzip -l "$FORGEJAR" 2>/dev/null | grep -E "RegisterCommandsEvent" | head -3
            echo "=== DimensionType fixedTime/bedWorks ==="
            javap -classpath "$CP" net.minecraft.world.level.dimension.DimensionType 2>&1 | grep -iE "fixedTime|bedWorks|natural" | head -6
          } > api_probe.txt 2>&1
          head -80 api_probe.txt

      - name: Inspect build outputs
        if: always()
        run: |
          {
            echo ""
            echo "=== build/libs ==="; ls -la build/libs 2>&1 || true
            echo "=== build/reobfJar ==="; ls -la build/reobfJar 2>&1 || true
            echo "=== jar contents ==="; unzip -l build/libs/*.jar 2>&1 | head -n 45 || true
          } >> build_output.txt

      - name: Publish build results into the branch
        if: always()
        run: |
          mkdir -p ci
          cp build_output.txt ci/last_build.log || true
          cp api_probe.txt ci/api_probe.txt || true
          cp build/libs/*.jar ci/ 2>/dev/null || true
          cp build/reobfJar/output.jar ci/output.jar 2>/dev/null || true
          ls -la ci
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci
          if git diff --cached --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          git commit -m "ci: build artifacts [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              echo "published"
              exit 0
            fi
            sleep 6
          done
          echo "publish failed (race) — артефакты останутся в логе задания"
          exit 0

      - name: Publish GitHub release with the ready JAR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MOD_VERSION="$(grep -m1 '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          TAG="v${MOD_VERSION}"
          JAR="build/libs/thedirector-${MOD_VERSION}.jar"
          echo "версия: $MOD_VERSION, тег: $TAG, файл: $JAR"
          ls -la "$JAR"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "релиз $TAG уже существует — обновляю артефакт"
            gh release upload "$TAG" "$JAR" --clobber
          else
            echo "создаю релиз $TAG"
            gh release create "$TAG" "$JAR" \
              --target "$GITHUB_REF_NAME" \
              --title "The Director ${MOD_VERSION} — Minecraft 1.20.1 (Forge)" \
              --notes-file RELEASE_NOTES.md
          fi
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | "\(.name) — \(.size) байт")'

  runtime:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare dedicated server
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          {
            echo "level-type=minecraft\\:flat"
            echo "online-mode=false"
            echo "max-players=2"
            echo "spawn-protection=0"
            echo "difficulty=normal"
            echo "view-distance=4"
            echo "simulation-distance=4"
            echo "sync-chunk-writes=false"
          } > run/server.properties
          chmod +x ./gradlew

      - name: Run server with mod self-test
        continue-on-error: true
        run: |
          set +e
          THEDIRECTOR_SELFTEST=1 timeout 900 ./gradlew runServer --no-daemon --console=plain > server_output.txt 2>&1
          echo "server_exit_code=$?" >> server_output.txt
          grep -E "SELFTEST|Done \(|The Director|Exception|ERROR|FAIL" server_output.txt | tail -60

      - name: Summarise self-test
        if: always()
        run: |
          {
            echo "=== SELFTEST REPORT ==="
            grep -A40 "THEDIRECTOR SELFTEST" server_output.txt 2>/dev/null | head -50 || echo "нет отчёта самотеста"
            echo "=== mod load lines ==="
            grep -E "thedirector|The Director" server_output.txt 2>/dev/null | head -25 || true
          } > selftest_summary.txt 2>&1
          cat selftest_summary.txt

      - name: Publish server log into the branch
        if: always()
        run: |
          mkdir -p ci
          cp server_output.txt ci/last_server_log.txt || true
          cp selftest_summary.txt ci/selftest_summary.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci
          if git diff --cached --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          git commit -m "ci: server self-test log [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              echo "published"
              exit 0
            fi
            sleep 6
          done
          echo "publish failed (race)"
          exit 0
