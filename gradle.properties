# Параметры памяти Gradle. Нужны для корректной работы ForgeGradle 6.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.debug=false

# Окружение Minecraft
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.2.0
forge_version_range=[47,)
loader_version_range=[47,)

# Маппинги (official = имена Mojang, как требует задание)
mapping_channel=official
mapping_version=1.20.1

# Информация о моде
mod_id=thedirector
mod_name=The Director
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.thedirector
mod_authors=Goplej
# Описание намеренно на латинице: Java Properties читает gradle.properties как ISO-8859-1,
# поэтому кириллица здесь превратилась бы в мусор в mods.toml.
mod_description=Directed psychological horror with no AI, no LLM and no network calls inside the mod: the system watches, stays silent, then strikes.
